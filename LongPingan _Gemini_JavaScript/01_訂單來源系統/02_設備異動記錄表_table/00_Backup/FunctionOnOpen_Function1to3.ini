/**
 * 建立選單：這會在你的試算表上方產生兩個獨立的功能鍵
 */
function onOpen() {
  var ui = SpreadsheetApp.getUi();
  ui.createMenu('司機自動化工具')
      .addItem('Step1：產生司機異動記錄', 'runStep1')
      .addSeparator() // 加入分隔線
      .addItem('Step2：過濾電話重覆', 'runStep2')
      .addSeparator() // 加入分隔線
      .addItem('Step3：司機資料', 'runStep3') // <--- 新增這一行
      .addToUi();
}

// ============================================================
// Step1：初步處理 (標記 新增司機、車號、電話)
// ============================================================
function runStep1() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sourceSheet = ss.getSheetByName("工作表3");
  
  if (!sourceSheet) {
    SpreadsheetApp.getUi().alert('錯誤：找不到「工作表3」');
    return;
  }
  
  var rawData = sourceSheet.getDataRange().getValues();
  if (rawData.length < 2) return;
  
  var header = rawData.shift();
  
  // 標準化與去重
  var cleanData = rawData.map(function(row) {
    var phoneRaw = row[3].toString().replace(/\D/g, '').trim(); 
    if (phoneRaw.length === 9 && phoneRaw.startsWith('9')) phoneRaw = "0" + phoneRaw;
    return { date: row[0], name: row[1].toString().trim(), car: row[2].toString().trim(), phone: phoneRaw };
  });

  cleanData.sort(function(a, b) {
    if (a.name < b.name) return -1;
    if (a.name > b.name) return 1;
    return new Date(a.date) - new Date(b.date);
  });

  var result = [['異動日期', '異動類型', '司機', '車號', '電話']];
  var driverLastState = {}; 

  cleanData.forEach(function(item) {
    var dateStr = (item.date instanceof Date) ? Utilities.formatDate(item.date, "GMT+8", "M月d日") : item.date.toString();
    var name = item.name;
    var phoneDisp = "'" + item.phone;

    if (!driverLastState[name]) {
      result.push([dateStr, '新增司機', name, item.car, phoneDisp]);
      driverLastState[name] = { car: item.car, phone: item.phone };
    } else {
      var last = driverLastState[name];
      if (item.car !== last.car) result.push([dateStr, '車號', name, item.car, phoneDisp]);
      if (item.phone !== last.phone) result.push([dateStr, '電話', name, item.car, phoneDisp]);
      if (item.car !== last.car || item.phone !== last.phone) {
        driverLastState[name] = { car: item.car, phone: item.phone };
      }
    }
  });

  var outputName = "產生司機異動記錄"; // 固定名稱以便Step2銜接
  var outSheet = ss.getSheetByName(outputName) || ss.insertSheet(outputName);
  outSheet.clear();
  outSheet.getRange("E:E").setNumberFormat("@");
  outSheet.getRange(1, 1, result.length, 5).setValues(result);
  outSheet.activate();
  SpreadsheetApp.getUi().alert('Step1執行完畢！已產生「' + outputName + '」');
}

// ============================================================
// Step2：最終整理 (電話合併換行、刪除電話列、跨日期去重)
// ============================================================
function runStep2() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sourceSheet = ss.getSheetByName("產生司機異動記錄");
  
  if (!sourceSheet) {
    SpreadsheetApp.getUi().alert('錯誤：找不到資料源，請確認「產生司機異動記錄」分頁存在。');
    return;
  }
  
  var rawData = sourceSheet.getDataRange().getValues();
  if (rawData.length < 2) return;
  rawData.shift(); 
  
  // 1. 收集電話 (嚴格補0並去重)
  var driverPhonesMap = {}; 
  rawData.forEach(function(row) {
    var name = row[2].toString().trim();
    // 徹底清除所有符號（包含單引號），只拿純數字
    var phoneRaw = row[4].toString().replace(/[^0-9]/g, '').trim(); 
    
    if (phoneRaw !== "") {
      if (phoneRaw.length === 9 && phoneRaw.startsWith('9')) phoneRaw = "0" + phoneRaw;
      if (!driverPhonesMap[name]) driverPhonesMap[name] = [];
      if (driverPhonesMap[name].indexOf(phoneRaw) === -1) driverPhonesMap[name].push(phoneRaw);
    }
  });

  // 2. 建立資料與處理換行
  var processedRows = [];
  rawData.forEach(function(row) {
    var type = row[1].toString().trim();
    if (type === "電話") return; // 刪除電話異動列

    var name = row[2].toString().trim();
    var allPhones = driverPhonesMap[name];
    
    var phoneString = "";
    if (allPhones && allPhones.length > 0) {
      // 關鍵修正：直接使用純數字陣列，不加任何單引號
      var displayArray = [];
      // 將最新電話（陣列最後一個）放在最上面，舊的往後排
      for (var i = allPhones.length - 1; i >= 0; i--) {
        displayArray.push(allPhones[i]); 
      }
      // 使用換行符號結合
      phoneString = displayArray.join("\n");
    }

    processedRows.push({
      date: row[0],
      type: type,
      name: name,
      car: row[3].toString().trim(),
      phone: phoneString
    });
  });

  // 3. 跨日期去重
  var finalResult = [['異動日期', '異動類型', '司機', '車號', '電話']];
  var seenKeys = new Set();
  processedRows.forEach(function(item) {
    var uniqueKey = [item.type, item.name, item.car, item.phone].join('|');
    if (!seenKeys.has(uniqueKey)) {
      finalResult.push([item.date, item.type, item.name, item.car, item.phone]);
      seenKeys.add(uniqueKey);
    }
  });

  // 4. 輸出與強制格式化
  var outName = "過濾電話重覆";
  var outSheet = ss.getSheetByName(outName) || ss.insertSheet(outName);
  outSheet.clear();
  
  // 重要：先設定純文字格式 @，這能確保就算沒有單引號，0開頭的電話也不會被吃掉
  outSheet.getRange("E:E").setNumberFormat("@"); 
  outSheet.getRange(1, 1, finalResult.length, 5).setValues(finalResult);
  
  // 強制開啟換行與對齊
  var fullRange = outSheet.getRange(1, 1, finalResult.length, 5);
  fullRange.setVerticalAlignment("top");
  outSheet.getRange(1, 5, finalResult.length, 1).setWrap(true); 
  
  outSheet.autoResizeColumns(1, 5);
  outSheet.activate();
  SpreadsheetApp.getUi().alert('處理完成！已移除所有單引號並保持正確換行。');
}

/**
 * Step3：產出「司機最新狀態主資料表」
 * 最終結果：只包含「司機、車號、電話」三欄，且司機不重複。
 */
function runStep3() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  // 抓取Step2產生的結果（或包含最終整理字樣的工作表）
  var sourceSheet = ss.getSheets().find(s => s.getName().includes("過濾電話重覆"));
  
  if (!sourceSheet) {
    SpreadsheetApp.getUi().alert('錯誤：找不到資料源，請先執行Step2。');
    return;
  }
  
  var rawData = sourceSheet.getDataRange().getValues();
  if (rawData.length < 2) return;
  rawData.shift(); // 移除標題列

  // 1. 利用 Map 提取每個司機最後出現的紀錄
  var latestInfoMap = new Map();
  rawData.forEach(function(row) {
    var name = row[2].toString().trim(); // 司機
    var car = row[3].toString().trim();  // 車號
    var phone = row[4].toString().trim(); // 電話內容
    
    // 存入 Map，重複的司機姓名會被後面的紀錄覆蓋，保留最新狀態
    latestInfoMap.set(name, { car: car, phone: phone });
  });

  // 2. 建立輸出陣列（僅三欄）
  var finalResult = [['司機', '車號', '電話']];
  
  // 排序姓名並填入資料
  var sortedNames = Array.from(latestInfoMap.keys()).sort();
  sortedNames.forEach(function(name) {
    var info = latestInfoMap.get(name);
    finalResult.push([name, info.car, info.phone]);
  });

  // 3. 輸出到「司機主資料表」
  var outName = "Make 司機資料";
  var outSheet = ss.getSheetByName(outName) || ss.insertSheet(outName);
  outSheet.clear();
  
  // 設定電話欄位格式為純文字並自動換行
  outSheet.getRange("C:C").setNumberFormat("@");
  outSheet.getRange("C:C").setWrap(true);
  
  // 寫入這三欄資料
  outSheet.getRange(1, 1, finalResult.length, 3).setValues(finalResult);
  
  // 美化外觀
  outSheet.getRange(1, 1, finalResult.length, 3).setVerticalAlignment("top");
  outSheet.autoResizeColumns(1, 3);
  outSheet.activate();
  
  SpreadsheetApp.getUi().alert('「司機主資料表」已產生！僅包含司機、車號、電話三欄。');
}